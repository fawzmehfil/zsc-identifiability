[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stage6-overcooked-runtime"
version = "0.1.0"
description = "Isolated Python 3.10 bridge for pinned OvercookedV2 experiments"
requires-python = ">=3.10,<3.11"
dependencies = [
  "chex==0.1.88",
  "distrax>=0.1.5,<0.2",
  "flax==0.10.2",
  "hydra-core>=1.3.2,<2",
  "jax==0.4.38",
  "jaxlib==0.4.38",
  "jaxmarl",
  "numpy==1.26.4",
  "omegaconf>=2.3,<3",
  "optax==0.2.4",
  "orbax-checkpoint==0.11.0",
  "overcooked-v2-experiments",
  "scipy==1.12.0",
  "wandb>=0.19,<0.20",
]

[tool.uv.sources]
jaxmarl = { path = "../../.external/overcookedv2-experiments/JaxMARL", editable = true }
overcooked-v2-experiments = { path = "../../.external/overcookedv2-experiments/experiments", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stage6_overcooked_runtime"]
